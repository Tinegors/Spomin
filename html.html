<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igra Spomin</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h1>🧠 Spomin</h1>
    <div class="vse">
        <div class="set">
            <select id="size">
                <option value="4">2 x 4</option>
                <option value="6" selected>3 x 4</option>
                <option value="8">4 x 4</option>
            </select>
            <button id="start" onclick="NaloziIgro()">Začni igro</button>
            <button id="tema" onclick="zamenjajTemo()">🌙 Temna tema</button>
            <button id="glasba" onclick="preklopiGlasbo()">🔈 Glasba: ON</button>
            <p id="timer">00:00</p>
            <p id="konec"></p>
        </div>

        <div class="desno">
            <div id="igra" class="igra"></div>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
